
<div class="clientes-container">
  <h1>Gestión de clientes</h1>
  <p>Administra los clientes de BeautyManager.</p>

  <div class="formulario">
    <h2>Registrar nuevo cliente</h2>

    <form (ngSubmit)="guardarCliente()">

      <label for="nombre">Nombre completo</label>
      <input
        id="nombre"
        type="text"
        name="nombre"
        [(ngModel)]="nuevoCliente.nombre"
        placeholder="Ej: María López"
        required
      />

      <label for="telefono">Teléfono</label>
      <input
        id="telefono"
        type="tel"
        name="telefono"
        [(ngModel)]="nuevoCliente.telefono"
        placeholder="Ej: 0987654321"
        required
      />

      <label for="id_usuario">Usuario asociado</label>

      <select
        id="id_usuario"
        name="id_usuario"
        [(ngModel)]="nuevoCliente.id_usuario"
        required
      >
        <option [ngValue]="null" disabled>
          Seleccione un usuario
        </option>

        <option
          *ngFor="let usuario of usuarios"
          [ngValue]="usuario.id_usuario"
        >
          {{ usuario.nombre }} - {{ usuario.correo }}
        </option>
      </select>

      <button type="submit">
        Guardar cliente
      </button>

    </form>

    <p class="exito" *ngIf="mensaje">
      {{ mensaje }}
    </p>

    <p class="error" *ngIf="error">
      {{ error }}
    </p>
  </div>

  <div class="tabla-clientes">
    <h2>Clientes registrados</h2>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Teléfono</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let cliente of clientes">
          <td>{{ cliente.id_cliente }}</td>
          <td>{{ cliente.nombre }}</td>
          <td>{{ cliente.telefono }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
